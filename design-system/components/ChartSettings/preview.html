<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title><style>body{padding:16px;}</style></head>
<body>
<div class="cs-dialog" role="dialog" aria-modal="true" aria-labelledby="st" style="width:440px">
<h2 class="cs-dialog__title" id="st">Chart settings</h2>
<div>
<div class="cs-setting"><span class="cs-setting__text"><span class="cs-setting__name">Theme</span><span class="cs-setting__hint">Follows your system unless you choose</span></span><div class="cs-seg" role="group" aria-label="Theme"><button aria-pressed="true">System</button><button aria-pressed="false">Dark</button><button aria-pressed="false">Light</button></div></div>
<div class="cs-setting"><span class="cs-setting__text"><span class="cs-setting__name">Candle colours</span><span class="cs-setting__hint">Up is always hollow, down is always filled</span></span><div class="cs-seg" role="group" aria-label="Candle colours"><button aria-pressed="true"><span class="cs-swatchpair" aria-hidden="true"><i style="background:var(--chart-up)"></i><i style="background:var(--chart-down)"></i></span> Blue / orange</button><button aria-pressed="false"><span class="cs-swatchpair" aria-hidden="true"><i style="background:var(--chart-up-conventional)"></i><i style="background:var(--chart-down-conventional)"></i></span> Green / red</button></div></div>
<div class="cs-setting"><span class="cs-setting__text"><span class="cs-setting__name">Gridlines</span></span><div class="cs-seg" role="group" aria-label="Gridlines"><button aria-pressed="true">Horizontal</button><button aria-pressed="false">Both</button><button aria-pressed="false">None</button></div></div>
<div class="cs-setting"><span class="cs-setting__text"><span class="cs-setting__name">Event markers</span><span class="cs-setting__hint">Split · dividend · earnings, each with its letter</span></span><label class="cs-check" style="min-height:0"><input type="checkbox" checked> Show</label></div>
</div>
<p class="caption cs-muted" style="margin:0">These are your personal view settings. Nobody else's chart changes.</p>
<div class="cs-dialog__actions"><button class="cs-btn cs-btn--primary">Done</button></div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&amp;display=swap"><meta charset="utf-8"><title>preview</title><style>body{padding:16px;}</style></head>
<body>
<div class="cs-dialog" role="dialog" aria-modal="true" aria-labelledby="sh" style="width:500px">
<h2 class="cs-dialog__title" id="sh">Share a link</h2>
<fieldset class="cs-choice"><legend class="cs-field__label" style="margin-bottom:6px">What the link opens</legend>
<label class="cs-choice__opt"><input type="radio" name="w" checked><span class="cs-choice__name">Snapshot as of now</span><span class="cs-choice__desc">Frozen at r16, 20:52 ET. Never changes, even if the chart does. Labelled "Snapshot".</span></label>
<label class="cs-choice__opt"><input type="radio" name="w"><span class="cs-choice__name">The live workspace</span><span class="cs-choice__desc">Shows the current chart. Needs an account with access.</span></label>
</fieldset>
<div class="cs-row" style="gap:12px"><label class="cs-field" style="flex:1"><span class="cs-field__label">Who can open it</span><select class="cs-select"><option>People in this workspace</option><option>Anyone with the link (read-only)</option></select></label><label class="cs-field" style="width:150px"><span class="cs-field__label">Expires</span><select class="cs-select"><option>In 7 days</option><option>In 30 days</option><option>Never</option></select></label></div>
<div class="cs-linkbox"><span>chartsspeak.app/s/nvda-r16-7f3k</span><button class="cs-btn cs-btn--compact cs-btn--quiet">Copy link</button></div>
<p class="caption cs-muted" style="margin:0">Opened links show the same data label and "as of" date. Anyone-with-the-link viewers can't edit, export or message.</p>
<div class="cs-dialog__actions"><button class="cs-btn cs-btn--quiet">Done</button></div>
</div>
</body>
</html>

<!-- @dsCard group="Export and share" height=470 -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&amp;display=swap"><meta charset="utf-8"><title>preview</title><style>body{padding:16px;}</style></head>
<body>
<div class="cs-dialog" role="dialog" aria-modal="true" aria-labelledby="ex" style="width:680px">
<h2 class="cs-dialog__title" id="ex">Export image</h2>
<div class="cs-export">
<div class="cs-export__preview" role="img" aria-label="Export preview with stamp: NVDA 1D, stored daily, split-adjusted, as of 28 Oct 2026"><svg viewBox="0 0 300 160" preserveAspectRatio="none" aria-hidden="true" style="position:absolute;inset:0 0 28px 0;width:100%;height:calc(100% - 28px)"><path d="M0 40H300M0 80H300M0 120H300" style="stroke:var(--chart-grid);fill:none"/><polyline points="0,130 30,124 60,128 90,110 120,96 150,70 180,74 210,58 240,46 270,40 300,30" style="fill:none;stroke:var(--chart-up);stroke-width:2"/><polyline points="0,128 40,126 80,118 120,104 160,88 200,74 240,62 300,48" style="fill:none;stroke:var(--chart-series-1);stroke-width:1.5"/></svg>
<div class="cs-stamp"><b>NVDA · 1D</b><span>Stored daily · split-adjusted, not dividend-adjusted</span><span>As of 28 Oct 2026</span><span class="cs-stamp__wm">ChartsSpeak</span><span class="cs-stamp__caption">Golden cross 14 Mar 2026 · SMA 50 128.06 vs SMA 200 127.91 · Mat</span></div></div>
<div class="cs-stack" style="gap:8px">
<label class="cs-field"><span class="cs-field__label">Format</span><select class="cs-select"><option>PNG · 2× (2400 × 1350)</option><option>PNG · 1×</option></select></label>
<label class="cs-check"><input type="checkbox" checked disabled> Data label and "as of" date <span class="caption cs-muted">(always on)</span></label>
<label class="cs-check"><input type="checkbox" checked> Evidence caption</label>
<label class="cs-check"><input type="checkbox" checked> Wordmark</label>
<label class="cs-check"><input type="checkbox"> Include my hidden items</label>
</div></div>
<p class="caption cs-muted" style="margin:0">Exports always carry the data label and date, so a picture can't pass for live data.</p>
<div class="cs-dialog__actions"><button class="cs-btn cs-btn--quiet">Cancel</button><button class="cs-btn cs-btn--primary">Export PNG</button></div>
</div>
</body>
</html>

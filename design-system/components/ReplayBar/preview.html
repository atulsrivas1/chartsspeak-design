<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&amp;display=swap"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>preview</title><style>body{padding:16px;}</style></head>
<body>
<div class="cs-replay" role="toolbar" aria-label="Replay">
<span class="cs-replay__state"><span aria-hidden="true">⏵</span>Replaying · not current</span>
<button class="cs-btn cs-btn--compact cs-btn--icon" aria-label="Back to start">⏮</button>
<button class="cs-btn cs-btn--compact cs-btn--icon" aria-label="Step back one bar">◁</button>
<button class="cs-btn cs-btn--compact cs-btn--primary" aria-label="Play">▶ Play</button>
<button class="cs-btn cs-btn--compact cs-btn--icon" aria-label="Step forward one bar">▷</button>
<div class="cs-seg" role="group" aria-label="Speed"><button aria-pressed="true">1×</button><button aria-pressed="false">2×</button><button aria-pressed="false">5×</button></div>
<span class="cs-replay__pos">Bar 51 of 210 · 14 Mar 2026</span>
<button class="cs-btn cs-btn--compact cs-btn--quiet">Jump to date</button>
<span class="cs-toolbar__spacer"></span>
<button class="cs-btn cs-btn--compact">Exit replay</button>
<div class="cs-replay__track" role="progressbar" aria-label="Bars revealed" aria-valuemin="0" aria-valuemax="210" aria-valuenow="51"><div class="cs-replay__fill" style="width:24%"></div></div>
</div>
</body>
</html>

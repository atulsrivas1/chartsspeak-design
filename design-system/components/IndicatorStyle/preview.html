<!-- @dsCard group="Settings" height=330 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title><style>body{padding:16px;}</style></head>
<body>
<div class="cs-popover" role="dialog" aria-label="Style for EMA 21" style="width:320px;padding:12px">
<span class="cs-field__label">EMA 21 · style</span>
<div class="cs-linepreview"><span style="border-top-width:2px;border-color:var(--chart-series-3)"></span></div>
<span class="caption cs-muted">Colour (chart palette only)</span>
<div class="cs-swatches" role="radiogroup" aria-label="Colour">
<button class="cs-swatch" role="radio" aria-checked="false" aria-label="Series 1"><i style="background:var(--chart-series-1)"></i></button>
<button class="cs-swatch" role="radio" aria-checked="false" aria-disabled="true" aria-label="Series 2, used by SMA 200"><i style="background:var(--chart-series-2)"></i></button>
<button class="cs-swatch" role="radio" aria-checked="true" aria-label="Series 3"><i style="background:var(--chart-series-3)"></i></button>
<button class="cs-swatch" role="radio" aria-checked="false" aria-label="Series 4"><i style="background:var(--chart-series-4)"></i></button>
<button class="cs-swatch" role="radio" aria-checked="false" aria-label="Series 5"><i style="background:var(--chart-series-5)"></i></button>
</div>
<span class="caption cs-muted">Width</span>
<div class="cs-seg" role="group" aria-label="Line width" style="align-self:flex-start"><button aria-pressed="false">1px</button><button aria-pressed="true">1.5px</button><button aria-pressed="false">2px</button><button aria-pressed="false">3px</button></div>
<div class="cs-popover__foot"><span>Personal view · others keep their colours</span><button class="cs-btn cs-btn--compact cs-btn--quiet">Done</button></div>
</div>
</body>
</html>

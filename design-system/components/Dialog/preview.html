<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>preview</title>
<style>body{padding:16px;}</style></head>
<body>
<div style="position:relative;height:300px;border-radius:var(--radius-panel);overflow:hidden;background:var(--surface-000)">
<div class="cs-scrim">
<div class="cs-dialog" role="dialog" aria-modal="true" aria-labelledby="dt">
<h2 class="cs-dialog__title" id="dt">Sign in again</h2>
<p class="cs-dialog__body">Your session ended. Your saved analysis is kept and will reopen as it was.</p>
<label class="cs-field"><span class="cs-field__label">Email</span><input class="cs-input" type="email" value="analyst@example.com"></label>
<div class="cs-dialog__actions"><button class="cs-btn cs-btn--quiet">Not now</button><button class="cs-btn cs-btn--primary">Sign in</button></div>
</div></div></div>
</body>
</html>

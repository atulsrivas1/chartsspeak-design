<!-- @dsCard group="Chart" height=150 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title><style>body{padding:16px;}</style></head>
<body>
<div class="cs-toolbar" style="margin:-16px" role="toolbar" aria-label="Chart">
<button class="cs-symbtn" aria-haspopup="listbox" aria-label="Symbol NVDA, change symbol"><svg class="cs-symbtn__icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>NVDA<span class="cs-caret" aria-hidden="true"></span></button>
<div class="cs-seg" role="group" aria-label="Interval"><button aria-pressed="false">1m</button><button aria-pressed="false">5m</button><button aria-pressed="true">1D</button></div>
<div class="cs-seg" role="group" aria-label="Chart type"><button aria-pressed="true">Candles</button><button aria-pressed="false">Bars</button><button aria-pressed="false">Line</button><button aria-pressed="false">Area</button></div>
<span class="cs-badge">Split-adjusted, not dividend-adjusted</span>
<span class="cs-toolbar__sep" aria-hidden="true"></span>
<button class="cs-btn cs-btn--compact"><span class="cs-btn__glyph" aria-hidden="true">+</span>Indicator</button>
<button class="cs-btn cs-btn--compact">Compare</button>
<span class="cs-toolbar__spacer"></span>
<button class="cs-btn cs-btn--compact cs-btn--quiet" aria-label="Undo add SMA 50"><span class="cs-btn__glyph" aria-hidden="true">↶</span>Undo add SMA 50</button>
<button class="cs-btn cs-btn--compact cs-btn--quiet cs-btn--icon" aria-label="Redo, nothing to redo" disabled>↷</button>
<button class="cs-btn cs-btn--compact cs-btn--quiet cs-btn--icon" aria-label="Chart settings"><svg class="cs-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
</div>
<div class="cs-toolbar" style="margin:16px -16px -16px;border-top:1px solid var(--border-100)" role="toolbar" aria-label="Range and axis">
<div class="cs-seg" role="group" aria-label="Range"><button aria-pressed="false">1M</button><button aria-pressed="false">6M</button><button aria-pressed="true">YTD</button><button aria-pressed="false">1Y</button><button aria-pressed="false">All</button></div>
<button class="cs-btn cs-btn--compact cs-btn--quiet">Go to date</button>
<button class="cs-btn cs-btn--compact cs-btn--quiet" aria-label="Reset view"><svg class="cs-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.5"/><path d="M3 2.5v3h3"/></svg>Reset view</button>
<span class="cs-toolbar__spacer"></span>
<span class="cs-seg__label">Scale</span>
<div class="cs-seg" role="group" aria-label="Price scale"><button aria-pressed="true">Auto</button><button aria-pressed="false">Log</button><button aria-pressed="false">%</button><button aria-pressed="false" aria-label="Lock scale"><svg class="cs-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="7" width="9" height="6.5" rx="1"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></svg></button></div>
</div>
</body>
</html>

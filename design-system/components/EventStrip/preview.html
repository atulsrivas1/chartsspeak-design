<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>preview</title><style>body{padding:16px;}</style></head>
<body>
<div style="border:1px solid var(--border-200);border-radius:var(--radius-panel);background:var(--surface-100)"><div class="cs-strip cs-strip--timeline" aria-label="On this chart. Choose an item to move the chart to it.">
<div class="cs-eventtrack" aria-hidden="true"><span class="cs-eventtrack__window" style="left: 0; right: 0;"></span><span class="cs-eventtrack__tick" data-active="true" style="left: 24%;"></span><span class="cs-eventtrack__tick" style="left: 53%;"></span></div>
<span class="caption cs-muted cs-strip__label">On this chart</span>
<button class="cs-evchip" aria-pressed="true"><span class="cs-avatar" aria-hidden="true">M</span><span class="cs-evchip__date">14 Mar</span>Golden cross</button>
<button class="cs-evchip"><span class="cs-avatar" aria-hidden="true">M</span><span class="cs-evchip__date">Range</span>SMA 50 / SMA 200</button>
<button class="cs-evchip"><span class="cs-avatar cs-avatar--person" aria-hidden="true">MS</span><span class="cs-evchip__date">10 Jun</span>Split 10:1</button>
</div></div>
</body>
</html>

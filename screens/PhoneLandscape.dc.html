<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChartsSpeak · phone landscape</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/chartsspeak/tokens.css">
<link rel="stylesheet" href="ds/chartsspeak/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="width: 844px; height: 390px; display: flex; flex-direction: column; background: var(--surface-000); color: var(--ink); font-family: var(--font-sans); overflow: hidden;">
  <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: var(--surface-100); border-bottom: 1px solid var(--border-200);">
    <span class="cs-toolbar__sym">NVDA</span>
    <span class="cs-badge">1D</span>
    <div class="cs-legend" style="margin-left: 8px;">
      <span class="cs-legend__item" style="color: var(--chart-series-1);"><span class="cs-legend__swatch"></span><span class="cs-legend__name">SMA 50</span><span class="cs-legend__val">128.06</span></span>
      <span class="cs-legend__ohlc"><span><b>C</b>133.97</span></span>
    </div>
    <span style="flex: 1;"></span>
    <div class="cs-seg" role="group" aria-label="Range"><button aria-pressed="false" style="min-height: 44px;">6M</button><button aria-pressed="true" style="min-height: 44px;">YTD</button><button aria-pressed="false" style="min-height: 44px;">1Y</button></div>
    <button class="cs-btn cs-btn--icon" aria-label="Exit full-screen chart">×</button>
  </div>
  <div class="cs-chart" style="flex: 1; position: relative; border-radius: 0;" tabindex="0" aria-label="Full-screen price chart. Rotate back to portrait for the conversation.">
    <dc-import name="ChartFrame" hint-size="100%,100%"></dc-import>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; min-height: 28px; padding: 0 12px; background: var(--surface-150); border-top: 1px solid var(--border-100); font-size: 11px; line-height: 16px; color: var(--ink-muted);"><span>▤ Stored daily · through 28 Oct · Split-adjusted, not dividend-adjusted</span><span>Rotate for the conversation</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>

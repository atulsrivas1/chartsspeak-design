<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChartsSpeak · phone touch</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/chartsspeak/tokens.css">
<link rel="stylesheet" href="ds/chartsspeak/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="cs-shell" data-theme="{{theme}}" data-screen="chart" style="width: 390px; height: 844px;">
  <header class="cs-topbar"><span class="cs-wordmark" role="img" aria-label="ChartsSpeak"><span aria-hidden="true">Chart</span><svg class="cs-wordmark__ss" viewBox="0 0 76 100" aria-hidden="true"><path class="acc" d="M38 8C67 8 67 30 38 46C7 62 7 94 38 94"></path><path class="halo" d="M27 40.1L49 51.9"></path><path d="M38 8C9 8 9 30 38 46C69 62 69 94 38 94"></path></svg><span aria-hidden="true">peak</span></span><span class="cs-tag">Private</span><span class="cs-topbar__spacer"></span><span class="cs-conn" role="status"><span class="cs-conn__dot" aria-hidden="true"></span>Connected</span></header>
  <div class="cs-shell__body">
    <main class="cs-shell__main">
      <div class="cs-titleblock"><h1 class="cs-title">NVDA · YTD 2026</h1><span class="small cs-muted">Stored daily · split-adjusted, not dividend-adjusted</span></div>
      <section class="cs-panel" aria-label="Chart">
        <div class="cs-toolbar" role="toolbar" aria-label="Chart">
          <div class="cs-seg" role="group" aria-label="Range"><button aria-pressed="false">1M</button><button aria-pressed="false">6M</button><button aria-pressed="true">YTD</button><button aria-pressed="false">1Y</button></div>
          <button class="cs-btn cs-btn--compact cs-btn--icon" aria-label="Reset view"><svg class="cs-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.5-3.5"></path><path d="M3 2.5v3h3"></path></svg></button>
          <button class="cs-btn cs-btn--compact"><span class="cs-btn__glyph" aria-hidden="true">+</span>Indicator</button>
        </div>
        <div class="cs-meta cs-meta--split"><span>Crosshair · 14 Mar 2026</span><span>lift to keep, tap to clear</span></div>
        <div class="cs-chart" tabindex="0" aria-label="Price chart. Crosshair at 14 March 2026: open 131.42, high 134.10, low 130.88, close 133.97.">
          <dc-import name="ChartFrame" crosshair="{{no}}" marker="{{no}}" hint-size="100%,100%"></dc-import>
          <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: calc(100% - 64px); height: 100%; pointer-events: none;">
            <path d="M58 0V100M0 38H100" style="stroke: var(--chart-crosshair); stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; fill: none;"></path>
          </svg>
          <div class="cs-readout" style="left: calc((100% - 64px) * 0.58 - 70px); top: 8px;"><span><b>14 Mar</b></span><span><b>O</b>131.42 <b>H</b>134.10</span><span><b>L</b>130.88 <b>C</b>133.97</span><span><b>SMA 50</b>128.06</span></div>
          <span aria-hidden="true" style="position: absolute; left: calc((100% - 64px) * 0.58 - 22px); top: calc(38% + 18px); width: 44px; height: 44px; border-radius: var(--radius-round); background: var(--ink); opacity: 0.18;"></span>
        </div>
      </section>
    </main>
    <aside class="cs-rail" aria-label="Assistant"></aside>
  </div>
  <div class="cs-touchhint" role="note"><span><b>Hold</b> for values · <b>drag</b> to pan · <b>pinch</b> to zoom</span><button class="cs-btn cs-btn--compact cs-btn--quiet cs-btn--icon cs-touchhint__x" aria-label="Dismiss tip">×</button></div>
  <div class="cs-shell__switch">
    <div class="cs-tabs cs-tabs--switch" role="tablist" aria-label="Screen"><button class="cs-tab" role="tab" aria-selected="true">Chart</button><button class="cs-tab" role="tab" aria-selected="false">Conversation</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark', no: false };
  }
}
</script>
</body>
</html>

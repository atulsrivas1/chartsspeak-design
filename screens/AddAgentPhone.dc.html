<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ChartsSpeak · add an agent, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/chartsspeak/tokens.css">
<link rel="stylesheet" href="ds/chartsspeak/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div data-theme="{{theme}}" style="width:390px;height:1240px;box-sizing:border-box;background:var(--surface-000);color:var(--ink);font-family:var(--font-sans);display:flex;flex-direction:column;overflow:hidden">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border-200);background:var(--surface-100)"><button class="cs-btn cs-btn--quiet cs-btn--compact">Cancel</button><h1 class="heading" style="margin:0;font-family:var(--font-display)">Add an agent</h1><span style="width:64px"></span></header>
  <div style="flex:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:14px" class="cs-phoneform">
    <div class="cs-fgrid">
        <label class="cs-field"><span class="cs-field__label">Name</span><input class="cs-input" value="" placeholder="A name people will @mention"><span class="cs-field__hint">Shown in the roster and on everything it does.</span></label>
        <label class="cs-field"><span class="cs-field__label">Provider</span><select class="cs-select" style="width:100%"><option selected>Choose a provider…</option><option>Claude</option><option>ChatGPT</option><option>Local model</option><option>Other, OpenAI-compatible</option></select></label>
        <label class="cs-field"><span class="cs-field__label">Model</span><select class="cs-select" style="width:100%"><option selected>Choose a model…</option></select><span class="cs-field__hint">The price per million tokens, in and out, shows here once you pick a model.</span></label>
        <label class="cs-field"><span class="cs-field__label">Key</span><span class="cs-row" style="gap:8px;align-items:center"><select class="cs-select" style="width:100%"><option selected>Choose a key by name…</option><option>ANTHROPIC_API_KEY</option><option>OPENAI_API_KEY</option></select></span><span class="cs-keyfound" data-ok="false"><span aria-hidden="true">⨯</span>Not chosen yet</span><span class="cs-field__hint">Keys are read by name from this machine. ChartsSpeak never asks you to type or paste one.</span></label>
        <label class="cs-field"><span class="cs-field__label">Acts for</span><select class="cs-select" style="width:100%"><option selected>Monika (you)</option><option>Atul</option><option>Priya</option></select><span class="cs-field__hint">Its proposals need this person's approval.</span></label>
        <label class="cs-field"><span class="cs-field__label">Where it runs</span><span class="cs-seg" role="group" aria-label="Where it runs"><button aria-pressed="true">Provider's servers</button><button aria-pressed="false">This machine</button></span><span class="cs-field__hint">Decides which line shows under its messages: Sent to or Stays on this machine.</span></label>
      </div>
      <fieldset class="cs-field" style="border:0;padding:0;margin:0;min-width:0"><legend class="cs-field__label" style="margin-bottom:6px">Tools <span class="cs-tag">Propose only</span></legend><div class="cs-fgrid" style="gap:6px 16px"><label class="cs-check" style="min-height:0"><input type="checkbox" checked disabled> Read stored data</label><label class="cs-check" style="min-height:0"><input type="checkbox" checked > Calculate on stored data</label><label class="cs-check" style="min-height:0"><input type="checkbox" checked > Propose markers and lines</label><label class="cs-check" style="min-height:0"><input type="checkbox"  > Propose indicator changes</label><label class="cs-check" style="min-height:0"><input type="checkbox"  > Propose alerts</label></div></fieldset>
      <div class="cs-fgrid">
        <label class="cs-field"><span class="cs-field__label">Per task limit (tokens)</span><input class="cs-input" value="8,000"><span class="cs-field__hint">Ceiling set by the workspace owner: 20,000.</span></label>
        <label class="cs-field"><span class="cs-field__label">Per day limit (tasks)</span><input class="cs-input" value="20"><span class="cs-field__hint">Ceiling set by the workspace owner: 50.</span></label>
      </div>
      <div class="cs-slotbox"><span class="label">What is sent</span><span class="small">Your question, the stored bars in view, the names of layers and markers, and this chart's conversation. Not your keys, other charts, private messages, or files.</span></div>
  </div>
  <footer style="padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border-200);background:var(--surface-100)"><button class="cs-btn cs-btn--primary" style="width:100%" disabled aria-disabled="true">Add agent</button></footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark' };
  }
}
</script>
</body>
</html>
